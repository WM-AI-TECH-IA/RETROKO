name: Check deployment entry points

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'render.yaml'
      - 'server/retroko_fastapi_server.py'
      - 'retroko-shell-api/main.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Python syntax for the services in render.yaml
        run: python3 -I -m py_compile server/retroko_fastapi_server.py retroko-shell-api/main.py
