name: Rust Build

on:
  push:
    branches: [main]
    paths:
      - 'main/hyra_merkle_test/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'main/hyra_merkle_test/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/hyra_merkle_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the sample
        run: cargo build --release

      - name: Check the sample output against SHA-256
        run: |
          ./target/release/rust_proj_memory > "$RUNNER_TEMP/rust-merkle.json"
          python3 - "$RUNNER_TEMP/rust-merkle.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          inputs = ["Archive A❤", "Données de compression 2048"]
          record = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert record["input"] == inputs
          assert record["hash"] == hashlib.sha256("".join(inputs).encode()).hexdigest()
          PY

      - name: Run the container smoke test
        run: bash test.sh
