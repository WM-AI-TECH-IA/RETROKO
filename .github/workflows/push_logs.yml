name: Check Render log script

on:
  pull_request:
    paths:
      - '.github/workflows/push_logs.yml'
      - 'scripts/render_log_pusher.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check log generator syntax
        run: python3 -I -m py_compile scripts/render_log_pusher.py

      - name: Exercise the generator in a temporary directory
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I "$GITHUB_WORKSPACE/scripts/render_log_pusher.py"
          python3 -I - <<'PY'
          from pathlib import Path

          logs = list(Path("logs/render").glob("*.log"))
          assert len(logs) == 1
          assert logs[0].read_text(encoding="utf-8") == "==> RENDER  LOG SIMULED... "
          PY
