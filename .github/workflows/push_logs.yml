name: Check Render log script

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check log generator syntax
        run: python3 -I -m py_compile scripts/render_log_pusher.py
